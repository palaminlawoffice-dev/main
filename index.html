<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สำนักงานทนายความ ปรมินทร์ วงษ์ชมภู</title>
    
    <!-- เปลี่ยนไอคอนบน Tab เบราว์เซอร์ (Favicon) เป็นโลโก้สำนักงาน -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1LId2CNiHpG4157vkY2nu-NM06Eb_7Xxy">
    
    <!-- Font Awesome Official Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.80);
            --text-main: #111111;
            --text-sub: #444444;
            --text-muted: #555555;
            --card-bg: #ffffff;
            --card-border: #222222;
            --btn-copy-bg: #f0f0f0;
            --btn-copy-border: #cccccc;
            --btn-copy-text: #333333;
            --divider-color: #888888;
            --toggle-bg: #ffffff;
            --toggle-border: #c5a059;
            --toggle-text: #111111;
        }

        /* ธีมโหมดมืด (Dark Mode) */
        [data-theme="dark"] {
            --bg-overlay: rgba(18, 18, 18, 0.88);
            --text-main: #ffffff;
            --text-sub: #cccccc;
            --text-muted: #aaaaaa;
            --card-bg: #242424;
            --card-border: #444444;
            --btn-copy-bg: #333333;
            --btn-copy-border: #555555;
            --btn-copy-text: #ffffff;
            --divider-color: #666666;
            --toggle-bg: #242424;
            --toggle-border: #c5a059;
            --toggle-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Charm', sans-serif, Arial;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)),
                        url('https://lh3.googleusercontent.com/d/1wzBcUv2a0wWPjRvNIIpBtVLkPtRPAd2E') center/cover no-repeat fixed; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
        }

        /* ปุ่มเปลี่ยน Dark Mode / White Mode ที่มุมขวาบน */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--toggle-bg);
            border: 2px solid var(--toggle-border);
            color: var(--toggle-text);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* โลโก้สำนักงาน */
        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #c5a059;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ข้อความส่วนหัว */
        h1 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.3;
        }
        .sub-title {
            font-size: 0.95rem;
            color: #d93838;
            margin-top: 4px;
            font-weight: 600;
        }
        .desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
            margin-bottom: 25px;
        }

        /* โครงสร้างปุ่มกด */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 12px;
            margin-bottom: 15px;
        }

        .btn-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }
        .btn-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.12);
        }

        /* ไอคอนยื่นออกมาทางซ้ายกึ่งกลางอย่างสมดุล */
        .icon-badge {
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.25rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* สีไอคอนแบรนด์ต่างๆ */
        .line-bg { background-color: #06C755; }
        .fb-bg { background-color: #1877F2; }
        .tiktok-bg { background-color: #000000; }
        .youtube-bg { background-color: #FF0000; }
        .gmail-bg { background-color: #EA4335; }
        .tel-bg { background-color: #34A853; }

        /* เส้นคั่นกลางรูปตาชั่ง */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--divider-color);
        }
        .divider i {
            padding: 0 10px;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* ปุ่ม Gmail / Tel แบบเต็มความกว้าง */
        .full-width-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-card-large {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }
        .btn-card-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.12);
        }

        /* จัดตำแหน่งข้อความให้อยู่กึ่งกลางตัวการ์ดอย่างสมดุลตรงกับแนวตาชั่ง */
        .content-link {
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px 15px;
        }
        .content-link .main-text {
            font-size: 0.9rem;
            font-weight: 800;
        }
        .content-link .sub-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* ปุ่มคัดลอก (Copy Button) ให้อยู่ชั้นบนสุด (z-index) */
        .copy-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--btn-copy-bg);
            border: 1px solid var(--btn-copy-border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--btn-copy-text);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            z-index: 3;
        }

        .note-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
        }
        .thanks-text {
            font-size: 0.8rem;
            color: #c5a059;
            font-weight: 600;
            margin-top: 6px;
        }

        /* Toast แจ้งเตือนเมื่อคัดลอก */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ปุ่มสลับ Dark Mode / White Mode ที่มุมขวาบน -->
    <button class="theme-toggle-btn" onclick="toggleThemeManually()" id="themeBtn">
        <i class="fa-solid fa-moon"></i> <span>Dark Mode</span>
    </button>

    <div class="container">
        <!-- โลโก้ส่วนหัว -->
        <div class="logo-box">
            <img src="https://lh3.googleusercontent.com/d/1LId2CNiHpG4157vkY2nu-NM06Eb_7Xxy" alt="สำนักงานทนายความ ปรมินทร์ วงษ์ชมภู">
        </div>

        <!-- ข้อความส่วนหัว -->
        <h1>สำนักงานทนายความ<br>ปรมินทร์ วงษ์ชมภู</h1>
        <div class="sub-title">รับปรึกษาปัญหาด้านกฎหมาย</div>
        <div class="desc">สามารถเลือกช่องทางติดต่อที่ท่านสะดวกได้ดังนี้ :</div>

        <!-- แถวบน 4 ช่องทาง -->
        <div class="social-grid">
            <!-- LINE -->
            <a href="https://line.me/ti/p/2nhEISjCsM" target="_blank" class="btn-card">
                <div class="icon-badge line-bg"><i class="fa-brands fa-line"></i></div>
                LINE
            </a>

            <!-- FACEBOOK -->
            <a href="https://www.facebook.com/share/1BoE9uY5Jq/" target="_blank" class="btn-card">
                <div class="icon-badge fb-bg"><i class="fa-brands fa-facebook-f"></i></div>
                FACEBOOK
            </a>

            <!-- TIKTOK -->
            <a href="https://vm.tiktok.com/ZS9S5MWMyyYRN-DrX7Q/" target="_blank" class="btn-card">
                <div class="icon-badge tiktok-bg"><i class="fa-brands fa-tiktok"></i></div>
                TIKTOK
            </a>

            <!-- YOUTUBE -->
            <a href="https://youtube.com/@w.palaminlawoffice?si=g9xOyIaFSQkQUuw2" target="_blank" class="btn-card">
                <div class="icon-badge youtube-bg"><i class="fa-brands fa-youtube"></i></div>
                YOUTUBE
            </a>
        </div>

        <!-- เส้นคั่นพร้อมรูปตาชั่ง -->
        <div class="divider">
            <i class="fa-solid fa-scale-balanced"></i>
        </div>

        <!-- แถวล่าง 2 ช่องทาง -->
        <div class="full-width-section">
            <!-- GMAIL -->
            <div class="btn-card-large">
                <div class="icon-badge gmail-bg"><i class="fa-solid fa-envelope"></i></div>
                <a href="#" onclick="openGmail(); return false;" class="content-link">
                    <div class="main-text">GMAIL</div>
                    <div class="sub-text">palamin.lawoffice@gmail.com</div>
                </a>
                <button class="copy-btn" onclick="copyToClipboard('palamin.lawoffice@gmail.com')">
                    <i class="fa-regular fa-copy"></i> คัดลอก
                </button>
            </div>

            <!-- TEL -->
            <div class="btn-card-large">
                <div class="icon-badge tel-bg"><i class="fa-solid fa-phone"></i></div>
                <a href="tel:0984869113" class="content-link">
                    <div class="main-text">TEL</div>
                    <div class="sub-text">098-4869113</div>
                </a>
                <button class="copy-btn" onclick="copyToClipboard('0984869113')">
                    <i class="fa-regular fa-copy"></i> คัดลอก
                </button>
            </div>
        </div>

        <div class="note-text">คลิกเพื่อไปยังแอป หรือกดปุ่มคัดลอกสำหรับ Gmail และ Tel</div>
        <div class="thanks-text">ขอบคุณที่ไว้วางใจใช้บริการครับ :)</div>
    </div>

    <!-- กล่องแจ้งเตือนก๊อปปี้สำเร็จ -->
    <div id="toast" class="toast">คัดลอกเรียบร้อย!</div>

    <script>
        // ระบบตรวจจับเวลาอัตโนมัติ (6:00 - 18:00 = White Mode / 18:00 - 6:00 = Dark Mode)
        function applyTimeBasedTheme() {
            var currentHour = new Date().getHours();
            var isNight = currentHour >= 18 || currentHour < 6;
            setTheme(isNight);
        }

        function setTheme(isDark) {
            var body = document.body;
            var btn = document.getElementById("themeBtn");
            if (isDark) {
                body.setAttribute("data-theme", "dark");
                btn.innerHTML = '<i class="fa-solid fa-sun"></i> <span>White Mode</span>';
            } else {
                body.removeAttribute("data-theme");
                btn.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Dark Mode</span>';
            }
        }

        // กดปุ่มสลับธีมด้วยตัวเอง
        function toggleThemeManually() {
            var body = document.body;
            var isCurrentlyDark = body.getAttribute("data-theme") === "dark";
            setTheme(!isCurrentlyDark);
        }

        // เรียกใช้ระบบปรับธีมตามเวลาเมื่อโหลดหน้าเว็บ
        applyTimeBasedTheme();

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                var toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(function(){ 
                    toast.classList.remove("show"); 
                }, 2000);
            });
        }

        function openGmail() {
            var email = "palamin.lawoffice@gmail.com";
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            if (isMobile) {
                window.location.href = "mailto:" + email;
            } else {
                window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + email, "_blank");
            }
        }
    </script>
</body>
</html>
